# Checks that catch a defect before a human would, and that need no build.
#
# There is deliberately NO build or test job. The app links ConstructCore.xcframework
# and ConstructTransport.xcframework, which are not in git: producing them means
# cross-compiling construct-core and construct-transport from sibling repositories
# with a Rust iOS toolchain. A runner cannot do that without checkout access to those
# repos, and a job that green-lights a build it never performed would be worse than
# no job. Build and test run locally — see docs/TESTING.md.
#
# What is here instead are the rules that are release-blocking, textual, and were
# until now enforced by nothing but memory. Each one exists because it failed once at
# the far end of the process — at upload, or on a user's screen — where it is most
# expensive to find.

# The list of checks lives in scripts/check_all.sh, which the pre-push hook runs too
# (scripts/install_hooks.sh). This file only calls it, so CI never shows a red the author could not
# have seen locally — it is the backstop for a push that skipped the hook. A check is added there,
# not here. What each check guards is written in its own script's header.

name: checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    # Pure text — no Xcode. privacy-manifest needs plutil and reports SKIP here; the job below runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check_all.sh
        run: ./scripts/check_all.sh

  privacy-manifest:
    # Needs macOS: the script reads PrivacyInfo.xcprivacy with plutil. Apple validates this manifest
    # on the binary at upload (ITMS-91053), so without it a gap surfaces at the worst moment.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check_all.sh --only privacy-manifest
        run: ./scripts/check_all.sh --only privacy-manifest
